<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Timer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }

    .mode-toggle {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
      gap: 8px;
      background: #f0f0f0;
      padding: 4px;
      border-radius: 10px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #2d6cdf;
      color: white;
      box-shadow: 0 2px 8px rgba(45, 108, 223, 0.3);
    }

    .mode-btn:not(.active):hover {
      color: #333;
    }

    .timer-display {
      text-align: center;
      margin-bottom: 30px;
    }

    .timer-circle {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto;
    }

    .timer-circle svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .timer-circle circle.bg {
      fill: none;
      stroke: #e8e8e8;
      stroke-width: 8;
    }

    .timer-circle circle.progress {
      fill: none;
      stroke: #2d6cdf;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 628;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.5s linear, stroke 0.3s ease;
    }

    .timer-circle circle.progress.work {
      stroke: #2d6cdf;
    }

    .timer-circle circle.progress.break {
      stroke: #28a745;
    }

    .timer-time {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 300;
      color: #333;
      font-variant-numeric: tabular-nums;
    }

    .settings {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-group label {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .setting-group input {
      width: 80px;
      padding: 10px 12px;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
      color: #333;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .setting-group input:focus {
      border-color: #2d6cdf;
    }

    .setting-group input::-webkit-outer-spin-button,
    .setting-group input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #2d6cdf;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1e5bd9;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(45, 108, 223, 0.3);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e0e0e0;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .flash {
      animation: flash 0.5s ease-in-out 3;
    }

    @keyframes flash {
      0%, 100% { background: white; }
      50% { background: #fff3cd; }
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px;
      }
      .timer-circle {
        width: 180px;
        height: 180px;
      }
      .timer-time {
        font-size: 36px;
      }
      .controls {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="work">Work</button>
      <button class="mode-btn" data-mode="break">Break</button>
    </div>

    <div class="timer-display">
      <div class="timer-circle">
        <svg viewBox="0 0 220 220">
          <circle class="bg" cx="110" cy="110" r="100"></circle>
          <circle class="progress work" id="progressCircle" cx="110" cy="110" r="100"></circle>
        </svg>
        <div class="timer-time" id="timerTime">25:00</div>
      </div>
    </div>

    <div class="settings">
      <div class="setting-group">
        <label>Work (min)</label>
        <input type="number" id="workMinutes" value="25" min="1" max="120">
      </div>
      <div class="setting-group">
        <label>Break (min)</label>
        <input type="number" id="breakMinutes" value="5" min="1" max="60">
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn">Start</button>
      <button class="btn btn-secondary" id="pauseBtn" disabled>Pause</button>
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
    </div>
  </div>

  <script>
    const workMinutesInput = document.getElementById('workMinutes');
    const breakMinutesInput = document.getElementById('breakMinutes');
    const timerTime = document.getElementById('timerTime');
    const progressCircle = document.getElementById('progressCircle');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const container = document.querySelector('.container');

    const CIRCUMFERENCE = 2 * Math.PI * 100;

    let currentMode = 'work';
    let timeLeft = 25 * 60;
    let totalTime = 25 * 60;
    let timerId = null;
    let isRunning = false;

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerTime.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

      const progress = (totalTime - timeLeft) / totalTime;
      const offset = CIRCUMFERENCE * (1 - progress);
      progressCircle.style.strokeDashoffset = offset;
    }

    function setMode(mode) {
      currentMode = mode;
      modeBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      progressCircle.className = `progress ${mode}`;
      totalTime = (mode === 'work' ? parseInt(workMinutesInput.value) : parseInt(breakMinutesInput.value)) * 60;
      timeLeft = totalTime;
      updateDisplay();
    }

    function playBeep() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = ctx.createOscillator();
      const gainNode = ctx.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(ctx.destination);

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(800, ctx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.5);

      gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

      oscillator.start(ctx.currentTime);
      oscillator.stop(ctx.currentTime + 0.5);
    }

    function flashScreen() {
      container.classList.add('flash');
      setTimeout(() => container.classList.remove('flash'), 1500);
    }

    function timerComplete() {
      clearInterval(timerId);
      isRunning = false;
      startBtn.textContent = 'Start';
      startBtn.disabled = false;
      pauseBtn.disabled = true;

      playBeep();
      flashScreen();

      if (currentMode === 'work') {
        setMode('break');
      } else {
        setMode('work');
      }
    }

    function startTimer() {
      if (isRunning) return;

      isRunning = true;
      startBtn.textContent = 'Running...';
      startBtn.disabled = true;
      pauseBtn.disabled = false;

      timerId = setInterval(() => {
        timeLeft--;
        updateDisplay();

        if (timeLeft <= 0) {
          timerComplete();
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!isRunning) return;

      clearInterval(timerId);
      isRunning = false;
      startBtn.textContent = 'Resume';
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    function resetTimer() {
      clearInterval(timerId);
      isRunning = false;
      startBtn.textContent = 'Start';
      startBtn.disabled = false;
      pauseBtn.disabled = true;

      totalTime = (currentMode === 'work' ? parseInt(workMinutesInput.value) : parseInt(breakMinutesInput.value)) * 60;
      timeLeft = totalTime;
      updateDisplay();
    }

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (!isRunning) {
          setMode(btn.dataset.mode);
        }
      });
    });

    workMinutesInput.addEventListener('change', () => {
      if (!isRunning && currentMode === 'work') {
        const val = Math.max(1, Math.min(120, parseInt(workMinutesInput.value) || 25));
        workMinutesInput.value = val;
        setMode('work');
      }
    });

    breakMinutesInput.addEventListener('change', () => {
      if (!isRunning && currentMode === 'break') {
        const val = Math.max(1, Math.min(60, parseInt(breakMinutesInput.value) || 5));
        breakMinutesInput.value = val;
        setMode('break');
      }
    });

    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    progressCircle.style.strokeDasharray = CIRCUMFERENCE;
    updateDisplay();
  </script>
</body>
</html>
